    <div className="mt-6 pop">
      <div id="cert" className="rounded-2xl p-6 text-center bg-amber-50 text-indigo-950 border-8 border-double border-amber-400">
        <p className="font-bold text-indigo-600">🎓 BONDAN ACADEMY</p><h2 className="text-2xl font-black text-indigo-700">SERTIFIKAT KELULUSAN DIGITAL</h2><p className="text-sm">Memahami Algoritma Digital Marketing</p><p className="mt-3 text-sm">diberikan kepada</p>
        <p className="text-3xl font-bold italic border-b-2 border-amber-400 inline-block min-w-[60%] my-2" style={{ fontFamily: "Georgia,serif" }}>{s.nama || "Nama Siswa"}</p><p className="text-sm">Kelas {s.kelas || "-"} · SMK Bisnis Digital</p>
        <div className="flex justify-center gap-6 my-3 text-sm"><div>🎮 Skor Game<br /><b className="text-xl">{c.gameTot}/500</b></div><div>📝 Skor Kuis<br /><b className="text-xl">{c.quiz}/100</b></div></div>
        <span className={"inline-block px-4 py-1 rounded-full font-bold text-white " + (c.lulus ? "bg-emerald-600" : "bg-amber-600")}>{c.lulus ? "LULUS" : "BELUM LULUS · butuh skor kuis ≥ 70"}</span>
      </div>
      {(!s.nama || !s.kelas) && <p className="text-amber-300 text-sm mt-2">⚠️ Lengkapi Nama & Kelas di tab Beranda agar tercetak di sertifikat.</p>}
      <div className="flex flex-wrap gap-2 mt-4 justify-center"><button onClick={download} className="bg-gradient-to-r from-amber-400 to-orange-400 text-indigo-950 font-black px-5 py-3 rounded-xl flex items-center gap-2"><Icon n="download" s={18} />Download Laporan & Sertifikat Belajar (.html)</button><button onClick={() => window.print()} className="glass px-4 py-3 rounded-xl">🖨️ Cetak</button></div>
    </div>
  );
  if (s.quiz.done) return (
    <div><div className="rounded-3xl p-5 bg-gradient-to-r from-indigo-600 to-cyan-600 text-center"><div className="text-5xl">{c.quiz >= 80 ? "🏆" : c.quiz >= 70 ? "🎉" : "💪"}</div><h2 className="text-2xl font-black">Nilai Kuis: {c.quiz}/100</h2><p className="text-sm">Benar {c.right} dari 10 soal</p></div>
      <h3 className="font-bold mt-5 mb-2">Pembahasan</h3>{QZ.map((x, k) => <div key={k} className="glass rounded-xl p-3 mb-2 text-sm"><b>{ans[k] === x.a ? "✅" : "❌"} Soal {k + 1}.</b> Jawabanmu: {ans[k] === undefined ? "-" : L5[ans[k]]} · Kunci: <b>{L5[x.a]}</b><p className="text-slate-300 mt-1">💡 {x.e}</p></div>)}
      <button onClick={() => setQ({ ans: [], done: false })} className="glass px-4 py-2 rounded-xl mt-2">🔁 Ulangi Kuis</button><Cert /></div>
  );
  const pick = j => { if (ans[i] !== undefined) return; const a = [...ans]; a[i] = j; setQ({ ans: a }); setShown(true); };
  const answered = ans[i] !== undefined;
  return (
    <div>
      <div className="flex justify-between text-sm mb-2"><span>📝 Kuis HOTS · Soal {i + 1}/10</span><span>Terjawab: {ans.filter(x => x !== undefined).length}/10</span></div>
      <div className="h-2 rounded-full bg-white/10 mb-4"><div className="h-full rounded-full bg-gradient-to-r from-cyan-400 to-amber-400 transition-all" style={{ width: (i + 1) * 10 + "%" }} /></div>
      <div className="glass rounded-2xl p-5"><p className="font-semibold leading-relaxed">{q.q}</p>
        <div className="mt-4 space-y-2">{q.o.map((o, j) => { const st = !answered ? "glass hover:bg-white/10" : j === q.a ? "bg-emerald-500/25 border border-emerald-400" : ans[i] === j ? "bg-rose-500/25 border border-rose-400" : "glass opacity-60"; return <button key={j} onClick={() => pick(j)} className={"w-full text-left rounded-xl p-3 flex gap-3 transition " + st}><b className="text-amber-300">{L5[j]}.</b><span>{o}</span></button>; })}</div>
        {answered && <div className="mt-4 rounded-xl p-3 pop bg-indigo-500/20 border border-indigo-400 text-sm"><b>{ans[i] === q.a ? "✅ Benar!" : "❌ Kurang tepat. Kunci: " + L5[q.a]}</b><p className="mt-1">💡 {q.e}</p></div>}
      </div>
      <div className="flex justify-between mt-4"><button disabled={i === 0} onClick={() => setI(i - 1)} className="glass px-4 py-2 rounded-xl disabled:opacity-30">◀ Sebelumnya</button>
        {i < 9 ? <button disabled={!answered} onClick={() => setI(i + 1)} className="bg-amber-400 text-indigo-950 font-bold px-5 py-2 rounded-xl disabled:opacity-40">Berikutnya ▶</button> : <button disabled={ans.filter(x => x !== undefined).length < 10} onClick={() => setQ({ done: true })} className="bg-emerald-400 text-emerald-950 font-bold px-5 py-2 rounded-xl disabled:opacity-40">Selesai & Lihat Sertifikat ✔</button>}</div>
    </div>
  );
}

/* ================= APLIKASI UTAMA ================= */
function App() {
  const [s, setS] = useStore(), [tab, setTab] = useState("beranda"), c = calc(s);
  const T = [["beranda", "Beranda", "home"], ["materi", "Materi", "book-open"], ["game", "Game", "gamepad-2"], ["kuis", "Kuis & Sertifikat", "award"]];
  const go = t => { setTab(t); window.scrollTo({ top: 0, behavior: "smooth" }); };
  return (
    <div className="min-h-screen pb-24 md:pb-8 bg-gradient-to-b from-indigo-950 via-slate-950 to-slate-950">
      <header className="sticky top-0 z-20 bg-indigo-950/90 backdrop-blur border-b border-white/10">
        <div className="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-300 to-orange-500 grid place-items-center text-xl">🎓</div>
          <div className="flex-1"><div className="font-black leading-none">Bondan Academy</div><div className="text-[11px] text-cyan-300">LMS Bisnis Digital · Algoritma Digital Marketing</div></div>
          <div className="text-xs bg-amber-400/20 text-amber-300 px-3 py-1 rounded-full font-bold">⭐ {c.gameTot + c.quiz} XP</div>
        </div>
        <nav className="max-w-4xl mx-auto px-4 hidden md:flex gap-2 pb-2">{T.map(([k, l, i]) => <button key={k} onClick={() => go(k)} className={"px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 " + (tab === k ? "bg-gradient-to-r from-indigo-500 to-cyan-500" : "hover:bg-white/10")}><Icon n={i} s={16} />{l}</button>)}</nav>
      </header>
      <main className="max-w-4xl mx-auto px-4 py-5">
        {tab === "beranda" && <Home s={s} setS={setS} c={c} go={go} />}
        {tab === "materi" && <Materi s={s} setS={setS} />}
        {tab === "game" && <Game s={s} setS={setS} c={c} />}
        {tab === "kuis" && <Kuis s={s} setS={setS} c={c} />}
      </main>
      <nav className="md:hidden fixed bottom-0 inset-x-0 z-20 bg-indigo-950/95 backdrop-blur border-t border-white/10 grid grid-cols-4">{T.map(([k, l, i]) => <button key={k} onClick={() => go(k)} className={"py-2 flex flex-col items-center text-[11px] " + (tab === k ? "text-amber-300" : "text-slate-400")}><Icon n={i} s={22} />{l.split(" ")[0]}</button>)}</nav>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
